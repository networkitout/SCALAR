    title: Path traversal leading to unauthenticated RCE
    bulletin: CTX267027
    exploited: true
    severity: critical
    requires: []
    fixed: {"12.1": "55.18", "13.0": "47.24"}
    not_affected: ["13.1", "13.1-fips", "13.1-ndcpp", "14.1", "14.1-fips"]
    verified: true

