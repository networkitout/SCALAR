# NetScaler ADC / Gateway vulnerable-build table used by `netrescale exposure`.
#
# Semantics per advisory:
#   fixed:        train -> first fixed build. Builds below it on that train are VULNERABLE.
#   not_affected: trains the bulletin lists as unaffected.
#   unfixed:      trains that are affected and will never get a fix (end of life).
#   Any train not listed gets status UNKNOWN, never a silent "fine".
#   requires:     config conditions for exploitability. Unknown conditions are reported as
#                 "possibly exposed", not dropped.
#   verified:     true  = build numbers were checked against the Citrix bulletin itself
#                 false = taken from secondary reporting; re-check before relying on it
#   exploited:    true when the CVE is in the CISA KEV catalog.
#   Trains a bulletin does not mention are filled in only conservatively: EoL trains as
#   unfixed, or a line commented "inferred" saying why. Anything else stays unlisted (UNKNOWN).
#
# Train keys: 12.1, 12.1-fips, 12.1-ndcpp, 13.0, 13.1, 13.1-fips, 13.1-ndcpp, 14.1, 14.1-fips
# Update data_version whenever this file changes. The tool warns when it's >30 days old.

data_version: "2026-10-13"

lifecycle:
  # status: supported | end_of_maintenance | end_of_life
  - {train: "12.1", status: end_of_life}
  - {train: "13.0", status: end_of_life}
  - {train: "13.1", status: end_of_maintenance,
     note: "EoM 2026-09-15, EoL 2027-09-15 per CTX241500", verified: true}
  - {train: "13.1-fips", status: supported, note: "FIPS/NDcPP lifecycle differs; verify CTX241500", verified: false}
  - {train: "13.1-ndcpp", status: supported, note: "FIPS/NDcPP lifecycle differs; verify CTX241500", verified: false}
  - {train: "14.1", status: supported}
  - {train: "14.1-fips", status: supported}

