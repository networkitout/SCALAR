# Management-plane activity from the NetScaler audit log (CMD_EXECUTED from GUI/CLI/API).
# Test-vector lines follow the documented ns.log format. Replace or extend them with
# sanitized real lines once `netrescale probe` has captured samples from production.

- id: mgmt-high-risk-command
  title: High-risk management command executed
  severity: high
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    fields:
      Command: '^(add|set|bind|unbind|rm|unset)\s+(system\s+(user|group|cmdPolicy|global|parameter)|ns\s+extension|ns\s+rpcNode|ns\s+acl|ns\s+ip\s.*-(mgmtAccess|restrictAccess))'
      Status: '^Success'
  mitre: [T1098, T1136]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 812 0 : User admin1 - Remote_ip 10.20.0.5 - Command "add system user backdoor ********" - Status "Success"'}
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 813 0 : User admin1 - Remote_ip 10.20.0.5 - Command "bind system user backdoor superuser 0" - Status "Success"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 814 0 : User admin1 - Remote_ip 10.20.0.5 - Command "show system user" - Status "Success"'}
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 815 0 : User admin1 - Remote_ip 10.20.0.5 - Command "add system user x ********" - Status "ERROR: Operation not permitted"'}

- id: mgmt-logging-disabled
  title: Audit logging removed or disabled
  severity: critical
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    fields:
      Command: '^(rm|unbind|unset|disable)\s+audit\s|^set\s+audit\s+(syslog|nslog)(Params|Action)\s.*-logLevel\s+NONE'
  mitre: [T1562.002]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 900 0 : User nsroot - Remote_ip 10.20.0.9 - Command "unbind audit syslogGlobal -policyName nr_syslog_pol" - Status "Success"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 901 0 : User nsroot - Remote_ip 10.20.0.9 - Command "show audit syslogAction" - Status "Success"'}

- id: mgmt-shell-command
  title: Shell command run through the NetScaler CLI or NITRO
  severity: high
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    fields:
      Command: '^shell(\s|$)'
  mitre: [T1059.004]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 950 0 : User nsroot - Remote_ip 198.51.100.7 - Command "shell" - Status "Success"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 951 0 : User nsroot - Remote_ip 10.20.0.9 - Command "show ns hostName" - Status "Success"'}

- id: mgmt-key-access
  title: Access to NetScaler key material via the CLI
  severity: critical
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    fields:
      Command: '/(flash/)?nsconfig/(keys|ssl)/|ns\.key\b'
  mitre: [T1552.004]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 960 0 : User nsroot - Remote_ip 198.51.100.7 - Command "shell cat /flash/nsconfig/keys/updated/*" - Status "Success"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default CLI CMD_EXECUTED 961 0 : User nsroot - Remote_ip 10.20.0.9 - Command "show ssl certKey" - Status "Success"'}

- id: mgmt-from-unexpected-ip
  title: Management activity from outside the admin networks
  severity: high
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    not_in_list:
      Remote_ip: admin_networks
  mitre: [T1078]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 970 0 : User admin1 - Remote_ip 198.51.100.7 - Command "show ns version" - Status "Success"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 971 0 : User admin1 - Remote_ip 10.20.0.5 - Command "show ns version" - Status "Success"'}

- id: mgmt-unknown-admin-user
  title: Management activity by an account that is not on the admin user list
  severity: high
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    not_in_list:
      User: admin_users
  mitre: [T1078, T1136]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 980 0 : User backdoor - Remote_ip 10.20.0.5 - Command "show ns version" - Status "Success"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default GUI CMD_EXECUTED 981 0 : User admin1 - Remote_ip 10.20.0.5 - Command "show ns version" - Status "Success"'}

- id: mgmt-login-bruteforce
  title: Repeated failed management logins from one address
  severity: high
  sources: [nslog]
  events: [CMD_EXECUTED]
  match:
    fields:
      Command: '^login\b'
      Status: '^ERROR'
  threshold: {count: 5, window_seconds: 300, group_by: [Remote_ip]}
  mitre: [T1110]
  tests:
    positive:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default API CMD_EXECUTED 990 0 : User nsroot - Remote_ip 198.51.100.7 - Command "login nsroot" - Status "ERROR: Invalid username or password"'}
    negative:
      - {source: nslog, line: 'Oct  5 10:00:01 <local0.info> 10.0.0.10 2026/10/05:10:00:01 GMT ns-gw-01 0-PPE-0 : default API CMD_EXECUTED 991 0 : User nr_nitro - Remote_ip 10.0.0.50 - Command "login nr_nitro" - Status "Success"'}
