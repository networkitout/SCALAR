name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netrescale
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: netrescale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrescale"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NETRESCALE_TEST_DATABASE_URL: postgresql+psycopg://netrescale:integration-test-only@127.0.0.1:5432/netrescale
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"   # Ubuntu 24.04's system Python
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q --timeout 120 -m "not prod_probe"
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.lock --require-hashes --no-deps --disable-pip
      - name: Static security scan
        run: pip install bandit && bandit -q -r src -ll -s B108
      - name: Install script syntax
        run: bash -n deploy/install.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --redact --no-banner
