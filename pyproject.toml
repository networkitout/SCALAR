[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalar"
version = "0.5.0"
description = "NetScaler log/telemetry collector, IOC detector and config-change monitor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    "zstandard>=0.22",
]

[project.optional-dependencies]
db = [
    "alembic>=1.13",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pip-tools>=7.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
scalar = "scalar.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scalar = ["data/*.yaml", "data/rules/*.yaml", "data/iocs/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "linux: requires Linux (systemd-creds, unix sockets, SO_PEERCRED)",
    "prod_probe: runs read-only against a real NetScaler; never in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["scalar", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["datetime.timedelta"]

[tool.ruff.lint.per-file-ignores]
# test vectors are real log/config lines and can't be wrapped
"tests/**" = ["S", "B", "E501"]
# printed NetScaler CLI commands must stay on one line
"src/scalar/appliance.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # deployment target, even when developing on Windows
strict = true
mypy_path = "src"
packages = ["scalar"]
